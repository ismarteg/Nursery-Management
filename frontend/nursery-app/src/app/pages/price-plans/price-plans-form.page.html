<section class="page">
  <app-page-header
    [titleKey]="editingId() ? 'PLANS.EDIT' : 'PLANS.ADD'"
    icon="fa-solid fa-tags"
    [breadcrumbs]="[
      { labelKey: 'NAV.PLANS', link: '/price-plans' },
      { labelKey: editingId() ? 'PLANS.EDIT' : 'PLANS.ADD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/price-plans">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'PLANS.NAME' | translate }}</span>
          <input name="name" [(ngModel)]="form.name" required />
        </label>
        <label>
          <span>{{ 'PLANS.DESCRIPTION' | translate }}</span>
          <input name="description" [(ngModel)]="form.description" />
        </label>
        <div class="row2">
          <label>
            <span>{{ 'PLANS.AMOUNT' | translate }}</span>
            <input name="amount" type="number" min="0" step="0.01" [(ngModel)]="form.amount" required />
          </label>
          <label>
            <span>{{ 'PLANS.CYCLE' | translate }}</span>
            <select name="billingCycle" [(ngModel)]="form.billingCycle" (ngModelChange)="onCycleChange()">
              @for (cycle of cycles; track cycle.value) {
                <option [ngValue]="cycle.value">{{ cycle.labelKey | translate }}</option>
              }
            </select>
          </label>
        </div>
        <label>
          <span>{{ 'PLANS.DAYS_COUNT' | translate }}</span>
          <input
            name="daysCount"
            type="number"
            min="1"
            max="3660"
            [(ngModel)]="form.daysCount"
            required
          />
        </label>
        <label class="check">
          <input type="checkbox" name="isActive" [(ngModel)]="form.isActive" />
          <span>{{ 'COMMON.ACTIVE' | translate }}</span>
        </label>
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/price-plans">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
