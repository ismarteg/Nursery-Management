<section class="page">
  <app-page-header
    [titleKey]="editingId() ? 'STAFF.EDIT' : 'STAFF.ADD'"
    icon="fa-solid fa-user-tie"
    [breadcrumbs]="[
      { labelKey: 'NAV.STAFF', link: '/staff' },
      { labelKey: editingId() ? 'STAFF.EDIT' : 'STAFF.ADD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/staff">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'STAFF.NAME' | translate }}</span>
          <input name="fullName" [(ngModel)]="form.fullName" required />
        </label>
        <div class="row2">
          <label>
            <span>{{ 'STAFF.PHONE' | translate }}</span>
            <input name="phone" [(ngModel)]="form.phone" />
          </label>
          <label>
            <span>{{ 'STAFF.EMAIL' | translate }}</span>
            <input name="email" type="email" [(ngModel)]="form.email" />
          </label>
        </div>
        <div class="row2">
          <label>
            <span>{{ 'STAFF.HIRE_DATE' | translate }}</span>
            <input name="hireDate" type="date" [(ngModel)]="form.hireDate" />
          </label>
          <label>
            <span>{{ 'STAFF.SALARY_TYPE' | translate }}</span>
            <select name="salaryType" [(ngModel)]="form.salaryType">
              <option [ngValue]="0">Monthly</option>
              <option [ngValue]="1">Daily</option>
              <option [ngValue]="2">Hourly</option>
            </select>
          </label>
        </div>
        <div class="row2">
          <label>
            <span>{{ 'STAFF.SALARY' | translate }}</span>
            <input name="baseSalary" type="number" [(ngModel)]="form.baseSalary" />
          </label>
          <label>
            <span>{{ 'STAFF.HOURLY_RATE' | translate }}</span>
            <input name="hourlyRate" type="number" [(ngModel)]="form.hourlyRate" />
          </label>
        </div>
        <label class="check">
          <input type="checkbox" name="isActive" [(ngModel)]="form.isActive" />
          <span>{{ 'COMMON.ACTIVE' | translate }}</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>{{ 'CLASSES.TITLE' | translate }}</legend>
        @for (item of classes(); track item.id) {
          <label class="check">
            <input
              type="checkbox"
              [name]="'class-' + item.id"
              [checked]="form.classIds.includes(item.id)"
              (change)="toggleClass(item.id, $any($event.target).checked)"
            />
            <span>{{ item.name }}</span>
          </label>
        }
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/staff">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
