<section class="page">
  <app-page-header
    titleKey="PAYMENTS.RECORD"
    icon="fa-solid fa-hand-holding-dollar"
    [breadcrumbs]="[
      { labelKey: 'NAV.PAYMENTS', link: '/payments' },
      { labelKey: 'PAYMENTS.RECORD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/payments">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>
  @if (childLabel()) {
    <p class="meta">{{ childLabel() }}</p>
  }

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else if (payingId()) {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'PAYMENTS.AMOUNT' | translate }}</span>
          <input name="payAmount" type="number" min="0.01" step="0.01" [(ngModel)]="payAmount" required />
        </label>
        <label>
          <span>{{ 'PAYMENTS.METHOD' | translate }}</span>
          <select name="payMethod" [(ngModel)]="payMethod">
            <option [ngValue]="0">Cash</option>
            <option [ngValue]="1">Card</option>
            <option [ngValue]="2">Transfer</option>
            <option [ngValue]="3">Other</option>
          </select>
        </label>
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/payments">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
