<section class="page">
  <app-page-header
    titleKey="PAYMENTS.ADD"
    icon="fa-solid fa-money-bill-wave"
    [breadcrumbs]="[
      { labelKey: 'NAV.PAYMENTS', link: '/payments' },
      { labelKey: 'PAYMENTS.ADD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/payments">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>

  <form class="form" (ngSubmit)="save()">
    <fieldset>
      <label>
        <span>{{ 'CHILDREN.NAME' | translate }}</span>
        <select name="childId" [(ngModel)]="form.childId" required (ngModelChange)="onChildChange()">
          <option value="">-</option>
          @for (child of children(); track child.id) {
            <option [value]="child.id">{{ child.fullName }} ({{ child.code }})</option>
          }
        </select>
      </label>
      <label>
        <span>{{ 'PLANS.NAME' | translate }}</span>
        <select name="pricePlanId" [(ngModel)]="form.pricePlanId" (ngModelChange)="onPlanChange()">
          <option value="">-</option>
          @for (plan of plans(); track plan.id) {
            <option [value]="plan.id">{{ plan.name }} ({{ plan.amount }})</option>
          }
        </select>
      </label>
      <div class="row2">
        <label>
          <span>{{ 'PAYMENTS.DUE' | translate }}</span>
          <input name="amountDue" type="number" min="0.01" step="0.01" [(ngModel)]="form.amountDue" required />
        </label>
        <label>
          <span>{{ 'PAYMENTS.PAID' | translate }}</span>
          <input name="amountPaid" type="number" min="0" step="0.01" [(ngModel)]="form.amountPaid" />
        </label>
      </div>
      <div class="row2">
        <label>
          <span>{{ 'PAYMENTS.DUE_DATE' | translate }}</span>
          <input name="dueDate" type="date" [(ngModel)]="form.dueDate" required />
        </label>
        <label>
          <span>{{ 'PAYMENTS.METHOD' | translate }}</span>
          <select name="method" [(ngModel)]="form.method">
            <option [ngValue]="0">Cash</option>
            <option [ngValue]="1">Card</option>
            <option [ngValue]="2">Transfer</option>
            <option [ngValue]="3">Other</option>
          </select>
        </label>
      </div>
      <label>
        <span>{{ 'COMMON.NOTES' | translate }}</span>
        <input name="notes" [(ngModel)]="form.notes" />
      </label>
    </fieldset>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-actions">
      <a routerLink="/payments">{{ 'COMMON.CANCEL' | translate }}</a>
      <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
    </div>
  </form>
</section>
