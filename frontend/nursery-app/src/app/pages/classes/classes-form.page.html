<section class="page">
  <app-page-header
    [titleKey]="editingId() ? 'CLASSES.EDIT' : 'CLASSES.ADD'"
    icon="fa-solid fa-chalkboard"
    [breadcrumbs]="[
      { labelKey: 'NAV.CLASSES', link: '/classes' },
      { labelKey: editingId() ? 'CLASSES.EDIT' : 'CLASSES.ADD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/classes">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'CLASSES.NAME' | translate }}</span>
          <input name="name" [(ngModel)]="form.name" required />
        </label>
        <label>
          <span>{{ 'CLASSES.CAPACITY' | translate }}</span>
          <input name="capacity" type="number" min="1" [(ngModel)]="form.capacity" required />
        </label>
        <div class="row2">
          <label>
            <span>{{ 'CLASSES.MIN_AGE' | translate }}</span>
            <input name="minAgeMonths" type="number" [(ngModel)]="form.minAgeMonths" />
          </label>
          <label>
            <span>{{ 'CLASSES.MAX_AGE' | translate }}</span>
            <input name="maxAgeMonths" type="number" [(ngModel)]="form.maxAgeMonths" />
          </label>
        </div>
        <label>
          <span>{{ 'COMMON.NOTES' | translate }}</span>
          <input name="notes" [(ngModel)]="form.notes" />
        </label>
        <label class="check">
          <input type="checkbox" name="isActive" [(ngModel)]="form.isActive" />
          <span>{{ 'COMMON.ACTIVE' | translate }}</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>{{ 'CLASSES.STAFF' | translate }}</legend>
        @for (member of staff(); track member.id) {
          <label class="check">
            <input
              type="checkbox"
              [name]="'staff-' + member.id"
              [checked]="form.staffIds.includes(member.id)"
              (change)="toggleStaff(member.id, $any($event.target).checked)"
            />
            <span>{{ member.fullName }}</span>
          </label>
        }
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/classes">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
