<section class="page">
  <app-page-header
    titleKey="USERS.RESET_PASSWORD"
    icon="fa-solid fa-key"
    [breadcrumbs]="[
      { labelKey: 'NAV.USERS', link: '/users' },
      { labelKey: 'USERS.RESET_PASSWORD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/users">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>
  @if (userName()) {
    <p class="meta">{{ userName() }}</p>
  }

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else if (userId() && userName()) {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'USERS.NEW_PASSWORD' | translate }}</span>
          <input name="newPassword" type="password" [(ngModel)]="newPassword" required minlength="6" />
        </label>
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/users">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
