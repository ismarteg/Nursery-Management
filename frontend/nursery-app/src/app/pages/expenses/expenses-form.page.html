<section class="page">
  <app-page-header
    [titleKey]="editingId() ? 'EXPENSES.EDIT' : 'EXPENSES.ADD'"
    icon="fa-solid fa-receipt"
    [breadcrumbs]="[
      { labelKey: 'NAV.EXPENSES', link: '/expenses' },
      { labelKey: editingId() ? 'EXPENSES.EDIT' : 'EXPENSES.ADD' }
    ]" />
  <div class="page-actions">
    <a class="btn" routerLink="/expenses">
    <i class="fa-solid fa-arrow-right"></i>
    {{ 'COMMON.BACK' | translate }}
    </a>
  </div>

  @if (loading()) {
    <p>{{ 'COMMON.LOADING' | translate }}</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      <fieldset>
        <label>
          <span>{{ 'EXPENSES.CATEGORY' | translate }}</span>
          <select name="categoryId" [(ngModel)]="form.categoryId" required>
            <option value="">-</option>
            @for (cat of categories(); track cat.id) {
              @if (cat.isActive || cat.id === form.categoryId) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            }
          </select>
        </label>
        <label>
          <span>{{ 'EXPENSES.ITEM_TITLE' | translate }}</span>
          <input name="title" [(ngModel)]="form.title" required />
        </label>
        <div class="row2">
          <label>
            <span>{{ 'EXPENSES.AMOUNT' | translate }}</span>
            <input name="amount" type="number" min="0.01" step="0.01" [(ngModel)]="form.amount" required />
          </label>
          <label>
            <span>{{ 'EXPENSES.DATE' | translate }}</span>
            <input name="expenseDate" type="date" [(ngModel)]="form.expenseDate" required />
          </label>
        </div>
        <label>
          <span>{{ 'EXPENSES.PAID_TO' | translate }}</span>
          <input name="paidTo" [(ngModel)]="form.paidTo" />
        </label>
        <label>
          <span>{{ 'COMMON.NOTES' | translate }}</span>
          <input name="notes" [(ngModel)]="form.notes" />
        </label>
      </fieldset>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/expenses">{{ 'COMMON.CANCEL' | translate }}</a>
        <button type="submit" class="primary" [disabled]="saving()">{{ 'COMMON.SAVE' | translate }}</button>
      </div>
    </form>
  }
</section>
